name: Release

# Phát hành: đẩy tag dạng v0.2.0 (hoặc bấm "Run workflow" và nhập tag) thì CI build
# bộ cài cho Windows/macOS/Linux, ký gói cập nhật, và đăng lên GitHub Releases cùng latest.json
# để app đã cài tự thấy bản mới. Xem docs/release.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag phát hành, ví dụ v0.2.0 (phải khớp version trong tauri.conf.json)"
        required: true

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: "--config src-tauri/tauri.release.conf.json" }
          - { os: macos-latest, args: "--config src-tauri/tauri.release.conf.json" }
          - { os: ubuntu-24.04, args: "--config src-tauri/tauri.release.conf.json" }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.inputs.tag || github.ref }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Thư viện hệ thống (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - name: Kiểm tra tag khớp version
        shell: bash
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "v$v" = "$TAG" ] || { echo "Tag $TAG không khớp version $v trong tauri.conf.json"; exit 1; }
      - name: Kiểm tra khoá ký bản cập nhật
        shell: bash
        env: { KEY: "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" }
        run: '[ -n "$KEY" ] || { echo "Thiếu secret TAURI_SIGNING_PRIVATE_KEY (xem docs/release.md)"; exit 1; }'
      - run: npm run fetch-pdfium

      # Ký số Windows: chỉ chạy khi đã có chứng chỉ trong secrets. Không có thì bộ cài vẫn ra, chỉ chưa ký
      # (Windows SmartScreen sẽ cảnh báo "nhà phát hành không xác định").
      - name: Ký số Windows (nếu có chứng chỉ)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Host "Chưa có chứng chỉ: bỏ qua bước ký số."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint -Force
          $conf.bundle.windows | Add-Member -NotePropertyName digestAlgorithm -NotePropertyValue "sha256" -Force
          $conf.bundle.windows | Add-Member -NotePropertyName timestampUrl -NotePropertyValue "http://timestamp.digicert.com" -Force
          $conf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json -Encoding utf8
          Write-Host "Đã nhập chứng chỉ, dấu vân tay $($cert.Thumbprint)"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: "Folioscope ${{ env.TAG }}"
          releaseBody: "Bản cài cho Windows (.exe / .msi), macOS và Linux. Người đã cài Folioscope sẽ được báo có bản mới khi mở app."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
