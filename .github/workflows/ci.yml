name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Thư viện hệ thống (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf tesseract-ocr tesseract-ocr-vie
      - run: npm ci
      - run: npm run fetch-pdfium
      - name: Dựng menu chuột phải Windows 11
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-shellext.ps1
      - run: npm test
      - run: npx tsc --noEmit
      - name: Rust test
        working-directory: src-tauri
        run: cargo test
      - name: Đóng gói app
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: folioscope-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
